name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
        default: configs/jdcloud_re-ss-01.config
      WRT_THEME:
        required: true
        type: string
        default: aurora
      WRT_NAME:
        required: true
        type: string
        default: JDCloud
      WRT_SSID:
        required: true
        type: string
        default: JDCloud-WiFi
      WRT_WORD:
        required: true
        type: string
        default: 12345678
      WRT_IP:
        required: true
        type: string
        default: 192.168.1.1
      WRT_PW:
        required: true
        type: string
        default: ""
      WRT_REPO:
        required: true
        type: string
        default: https://github.com/yonyony1/immortalwrt-laipeng668.git
      WRT_BRANCH:
        required: true
        type: string
        default: openwrt-25.12
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: ${{ inputs.WRT_REPO }}
      repo_branch: ${{ inputs.WRT_BRANCH }}
      config_file: ${{ inputs.WRT_CONFIG }}
      firmware_tag: ${{ inputs.WRT_NAME }}
      kernel_file: kernel-6.18
      artifact_prefix: JDCloud
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        这是开启全功能NSS的6.18内核固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，添加了额外的软件包cpufreq、ddns、upnp、wol、samba4、vlmcsd、aria2、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、openlist2、wireguard、watchcat、passwall、gecoosac，并添加了若干工具。
      WRT_THEME: ${{ inputs.WRT_THEME }}
      WRT_SSID: ${{ inputs.WRT_SSID }}
      WRT_WORD: ${{ inputs.WRT_WORD }}
      WRT_IP: ${{ inputs.WRT_IP }}
      WRT_PW: ${{ inputs.WRT_PW }}
