name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
        default: configs/jdcloud_re-ss-01.config
      WRT_THEME:
        required: true
        type: string
        default: aurora
      WRT_NAME:
        required: true
        type: string
        default: JDCloud
      WRT_SSID:
        required: true
        type: string
        default: JDCloud‑WiFi
      WRT_WORD:
        required: true
        type: string
        default: 12345678
      WRT_IP:
        required: true
        type: string
        default: 192.168.2.1
      WRT_PW:
        required: true
        type: string
        default: password
      WRT_REPO:
        required: true
        type: string
        default: https://github.com/yonyony1/immortalwrt-laipeng668.git
      WRT_BRANCH:
        required: true
        type: string
        default: openwrt-25.12
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    env:
      WRT_THEME: ${{ inputs.WRT_THEME }}
      WRT_SSID: ${{ inputs.WRT_SSID }}
      WRT_WORD: ${{ inputs.WRT_WORD }}
      WRT_IP: ${{ inputs.WRT_IP }}
      WRT_PW: ${{ inputs.WRT_PW }}
    with:
      repo_url: ${{ inputs.WRT_REPO }}
      repo_branch: ${{ inputs.WRT_BRANCH }}
      config_file: ${{ inputs.WRT_CONFIG }}
      firmware_tag: ${{ inputs.WRT_NAME }}
